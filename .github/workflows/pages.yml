# Выкладка демо на GitHub Pages после каждого пуша в основную ветку.
# Однократно: Settings → Pages → Source: GitHub Actions (репозиторий должен быть публичным).
name: GitHub Pages

on:
  push:
    branches: [claude/admiring-shannon-unr8lw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # на бесплатном тарифе GitHub Pages работает только из публичного репозитория — для приватного пропускаем
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      # сайт проекта живёт в подпапке /<репозиторий>/ — сборка добавит её к путям фото
      - run: node scripts/build.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # полный адрес (со своим доменом — он) — для картинки в превью ссылок на демо
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # корень — редирект на основной сайт, витрина — по секретному адресу из секретов репозитория
      - run: node scripts/private-index.mjs
        env:
          PRIVATE_PATH: ${{ secrets.PRIVATE_PATH }}
      # Проверка перед выкладкой: каждый сайт открывается на телефоне без ошибок и горизонтальной прокрутки,
      # запись проходит до конца — в Chrome и Safari (WebKit). Не прошла — демо на сайте остаются прежними.
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium webkit
      - run: node scripts/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
