scene((root, sc) => {
  const M = META;
  const sen = sentences(sc);
  let calc = null;
  const tourStart = C.calc ? sen[1].a - 0.2 : 0;
  if (C.calc) {
    const box = add(root, '<div class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>');
    const t1 = add(box, `<div class="abs disp" style="left:150px;top:300px;font-size:${Math.round(96 * C.dispScale)}px">${C.calc.t1}</div>`);
    const t2 = add(box, `<div class="abs" style="left:150px;top:${C.calc.t2top || 520}px;width:720px;font-size:40px;line-height:1.3;color:${C.muted};font-weight:500">${C.calc.t2}</div>`);

    const card = add(box, `<div class="abs" style="left:1060px;top:${(1000 - hh) / 2}px;width:${w}px;height:${hh}px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.55)"></div>`);
    const imgs = [0, 1, 2, 3].map((i) => add(card, `<img src="${SH}est-${i}.png" style="position:absolute;left:0;top:0;width:${w}px">`));
    const kk = w / M.estBox.width;
    const ring = add(card, `<div class="ring" style="left:${M.priceBox.x * kk - 14}px;top:${M.priceBox.y * kk - 12}px;width:${M.priceBox.w * kk + 120}px;height:${M.priceBox.h * kk + 24}px"></div>`);
    const times = C.calc.at(sc);
    calc = (s) => {
      const out = pr(s, tourStart - 0.1, tourStart + 0.5);
      st(box, { op: 1 - out, x: -120 * eo(out) });
      inn(t1, s, 0.1, 0.7, 50); inn(t2, s, 0.6, 0.7, 30);
      inn(card, s, 0.3, 0.8, 80);
      // смена кадров без сдвига: цена меняется на месте
      imgs.forEach((im, i) => { const a = times[i], b = times[i + 1] ?? 1e9; im.style.opacity = i === 0 ? 1 : eo(pr(s, a, a + 0.25)) * (s < b + 0.3 || i === 3 ? 1 : 1); });
      const ra = wordAt(sc, C.calc.ring);
      const rk = eo(pr(s, ra, ra + 0.4));
      st(ring, { op: rk, s: 1.08 - 0.08 * rk });
    };
  }
  const W = 1500, VH = 760;
  const wrap = add(root, '<div class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>');
  const br = browser(wrap, { x: 210, y: 104, w: W, h: VH, src: SH + 'desk-full.jpg' });
  const k = br.k;
  const mb = M.mapBox;
  const map = add(br.vp, `<div class="map" style="left:${mb.x * k}px;top:${mb.y * k}px;width:${mb.w * k}px;height:${mb.h * k}px">
     <i style="left:-10%;top:42%;width:130%;height:22px;transform:rotate(-8deg)"></i><i style="left:30%;top:-10%;width:18px;height:130%;transform:rotate(12deg)"></i>
     <i style="left:62%;top:-10%;width:12px;height:130%;transform:rotate(-20deg)"></i><i style="left:-10%;top:76%;width:130%;height:12px;transform:rotate(4deg)"></i>
     <div style="position:absolute;left:48%;top:30%;width:46px;height:46px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e5483b;box-shadow:0 8px 16px rgba(0,0,0,.3)"></div>
     <div style="position:absolute;left:12px;bottom:12px;padding:6px 12px;border-radius:8px;background:#fff;color:#222;font:600 16px Onest">Яндекс Карты</div></div>`);
  const stops = C.tour.map(([label, sec, word]) => ({ label, y: sec === 0 ? 0 : sec === 'contacts' ? mb.y - 150 : (M.sections[sec] || 0) - 70, at: word ? wordAt(sc, word) - 0.25 : tourStart }));
  if (N !== 'barber') stops.sort((p, q) => p.y - q.y);
  const maxY = M.deskH - VH / k;
  stops.forEach((p) => (p.y = Math.min(p.y, maxY)));
  const label = add(wrap, '<div class="pill" style="left:250px;top:176px"><b></b><span></span></div>');
  const wb = M.widgetBox;
  const ring = N === 'barber' ? add(br.vp, `<div class="ring" style="left:${wb.x * k - 10}px;top:${wb.y * k - 10}px;width:${wb.w * k + 20}px;height:${Math.min(wb.h, 900 - wb.y) * k + 10}px"></div>`) : null;
  // автосервис: одна плавная прокрутка сверху вниз, подпись — по разделу в кадре
  let smooth = null;
  if (N !== 'barber') {
    const y0 = stops[0].y, y1 = stops[stops.length - 1].y, a0 = tourStart + 0.35, a1 = sc.dur - 0.1;
    const scrollAt = (s) => { const x = pr(s, a0, a1); return lerp(y0, y1, (1 - Math.cos(Math.PI * x)) / 2); };
    // промежуточные разделы (не названы в озвучке) — без подписи
    const extra = ['steps', 'offers', 'faq'].filter((x) => M.sections[x]).map((x) => ({ label: '', y: M.sections[x] - 70 }));
    const marks = [...stops.map((p) => ({ label: p.label, y: p.y })), ...extra].sort((p, q) => p.y - q.y);
    const idxAt = (y) => { let i = 0; marks.forEach((m, j) => { if (y + 420 >= m.y) i = j; }); return i; };
    const changes = [{ i: 0, t: -1 }];
    for (let t = a0; t <= sc.dur; t += 1 / 60) { const i = idxAt(scrollAt(t)); if (marks[i].label !== marks[changes[changes.length - 1].i].label) changes.push({ i, t }); }
    let named = marks[0].label; changes.forEach((x) => { x.shown = marks[x.i].label || named; if (marks[x.i].label) named = marks[x.i].label; });
    smooth = (s) => { let c = changes[0]; changes.forEach((x) => { if (s >= x.t) c = x; }); return { y: scrollAt(s), label: marks[c.i].label, shown: c.shown, at: c.t < 0 ? tourStart : c.t }; };
  }
  return (s) => {
    if (calc) calc(s);
    const kin = eo(pr(s, tourStart, tourStart + 0.7));
    st(wrap, { op: kin, x: (1 - kin) * 160 });
    if (smooth) {
      const v = smooth(s);
      br.imgs[0].style.transform = `translate3d(0,${-v.y * k}px,0)`;
      map.style.transform = `translate3d(0,${-v.y * k}px,0)`;
      const lab = label.querySelector('span');
      if (lab.textContent !== v.shown) lab.textContent = v.shown;
      const lk = v.label ? eo(pr(s, v.at, v.at + 0.35)) : 1 - pr(s, v.at, v.at + 0.2);
      st(label, { op: kin * lk, y: (1 - lk) * 10 });
      return;
    }
    let y = stops[0].y, cur = 0;
    for (let i = 1; i < stops.length; i++) {
      const a = stops[i].at;
      const m = eio(pr(s, a, a + 0.75));
      if (s >= a) cur = i;
      y = lerp(y, stops[i].y, m);
    }
    br.imgs[0].style.transform = `translate3d(0,${-y * k}px,0)`;
    map.style.transform = `translate3d(0,${-y * k}px,0)`;
    if (ring) { ring.style.transform = `translate3d(0,${-y * k}px,0)`; ring.style.opacity = eo(pr(s, 0.6, 1.0)) * (1 - pr(s, stops[1].at, stops[1].at + 0.3)); }
    const lab = label.querySelector('span');
    if (lab.textContent !== stops[cur].label) lab.textContent = stops[cur].label;
    const la = stops[cur].at;
    const lk = eo(pr(s, la + 0.2, la + 0.6));
    st(label, { op: kin * lk, y: (1 - lk) * 16 });
  };
});

    const br = browser(L, { x: X, y: Y, w: W, h: VH, src: SH + p.src, url: C.domain + '/admin' });
    const k = br.k;
    const ring = add(br.vp, `<div class="ring" style="left:${p.box.x * k - 12}px;top:${p.box.y * k - 12}px;width:${p.box.width * k + 24}px;height:${Math.min(p.box.height, 860 - p.box.y) * k + 24}px"></div>`);
    const lab = add(L, `<div class="pill" style="left:260px;top:790px"><b></b>${p.label}</div>`);
    return { L, ring, lab };
  });
  return (s) => {
    els.forEach((e, i) => {
      const a = parts[i].at, b = parts[i + 1] ? parts[i + 1].at : 1e9;
      const kin = i === 0 ? eo(pr(s, 0, 0.6)) : eo(pr(s, a, a + 0.6));
      const out = pr(s, b, b + 0.45);
      st(e.L, { op: kin * (1 - out), x: (i === 0 ? 0 : (1 - kin) * 140) - 100 * eo(out) });
      const rk = eo(pr(s, a + 0.6, a + 1.0)); st(e.ring, { op: rk, s: 1.04 - 0.04 * rk });
      inn(e.lab, s, a + 0.5, 0.5, 20);
    });
  };
});

// 5. Админка
scene((root, sc) => {
  const sen = sentences(sc), M = META;
  const tabs = [['madm-main.png', 'Тексты', 0], ['madm-svc.png', 'Цены', 'цены'], ['madm-staff.png', 'Мастера', C.staffWord || 'мастеров'], ['madm-photo.png', 'Фото и логотип', 'фото'], ['madm-style.png', 'Оформление', 'оформление']];
  const ph = phone(root, { x: 190, y: 92, w: 390, src: tabs.map((t) => SH + t[0]) });
  const times = tabs.map((t) => (t[2] ? wordAt(sc, t[2]) - 0.1 : 0));
  const lab = add(root, '<div class="pill" style="left:740px;top:820px;z-index:3"><b></b><span></span></div>');
  const brw = 1040, brh = brw * 900 / 1440;
  const br = browser(root, { x: 700, y: 262, w: brw, h: brh, src: C.styles.map((x) => `${SH}style-${x}.png`) });
  const sa = wordAt(sc, '«Сохранить»') - 0.15;
  const sx = 190 + 13 + (M.saveBox.x + M.saveBox.width / 2) * ph.k, sy = 92 + 13 + (M.saveBox.y + M.saveBox.height / 2) * ph.k;
  const rip = add(root, '<div class="ripple"></div>');
  const badge = add(root, `<div class="pill" style="left:${700 + brw - 300}px;top:226px;z-index:3"><b></b>Сайт обновился</div>`);
  const ttl = add(root, `<div class="abs disp" style="left:700px;top:132px;font-size:${Math.round(66 * C.dispScale)}px">${C.editTitle || 'Правите сами — с телефона'}</div>`);
  const stTimes = C.styles.map((_, i) => (i === 0 ? 0 : sa + 0.45 + (i - 1) * 0.7));
  return (s) => {
    inn(ph.el, s, 0, 0.8, 80);
    swap(ph.imgs, 0, s, times, 0.3);
    let cur = 0; times.forEach((t, i) => { if (s >= t) cur = i; });
    const span = lab.querySelector('span'); if (span.textContent !== tabs[cur][1]) span.textContent = tabs[cur][1];
    const lk = eo(pr(s, times[cur] + 0.1, times[cur] + 0.45)); st(lab, { op: lk * (1 - pr(s, sa - 0.4, sa)), y: (1 - lk) * 14 });
    inn(ttl, s, 0.3, 0.7, 30);
    inn(br.el, s, 0.5, 0.9, 100);
    swap(br.imgs, 0, s, stTimes, 0.3);
    const rk = pr(s, sa, sa + 0.5); st(rip, { op: rk > 0 && rk < 1 ? 1 - rk : 0, x: sx, y: sy, s: 0.3 + rk });
    const ba = wordAt(sc, 'обновился') - 0.3; const bk = eo(pr(s, ba, ba + 0.5)); st(badge, { op: bk, s: 0.8 + 0.2 * bk });
  };
});

// 6. Всё ваше
scene((root, sc) => {
  const items = [
    ['хостинге', 'Ваш хостинг', 'Любой с PHP 8: Timeweb, Beget, REG.RU', '<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>'],
    ['домене', 'Ваш домен', 'Сайт, заявки и данные — у вас', 'url'],
    ['подписки', '0 ₽ в месяц', 'Разовая оплата, без подписки', '<div class="disp" style="font-size:66px;color:var(--acc)">0 ₽</div>'],
  ];
  const cards = items.map(([w, t, d, ic], i) => add(root, `<div class="card" style="left:${140 + i * 565}px;top:270px;width:520px;height:440px;padding:46px">
     <div class="ic" style="height:110px;color:var(--acc);display:flex;align-items:center">${ic === 'url' ? `<div style="width:100%;height:64px;border-radius:32px;background:#fff;color:#333;display:flex;align-items:center;padding:0 24px;font-size:25px;font-weight:500"><span class="u"></span><span class="caret" style="width:2px;height:30px;background:#333;margin-left:2px"></span></div>` : ic}</div>
     <div class="disp" style="font-size:${Math.round(58 * C.dispScale)}px;margin-top:36px">${t}</div>
     <div style="font-size:30px;line-height:1.35;color:${C.muted};margin-top:20px">${d}</div></div>`));
  const url = 'https://' + C.domain;
  const ats = items.map(([w]) => wordAt(sc, w) - 0.35);
  return (s) => {
    cards.forEach((c, i) => { const k = eo(pr(s, ats[i], ats[i] + 0.6)); st(c, { op: k, y: (1 - k) * 70, blur: (1 - k) * 6 }); });
    const u = cards[1].querySelector('.u'); const n = Math.floor(cl((s - ats[1] - 0.3) / 1.0) * url.length);
    if (u.textContent.length !== n) u.textContent = url.slice(0, n);
    cards[1].querySelector('.caret').style.opacity = Math.floor(s * 2) % 2 ? 1 : 0.2;
  };
});

// 7. Призыв
scene((root, sc) => {
  const sen = sentences(sc);
  const wall = add(root, '<div class="abs" style="left:-200px;top:-260px;width:2400px;height:1700px;transform-origin:50% 50%"></div>');
  const pics = [...C.styles.map((x) => `style-${x}.png`), 'mob-hero.png', 'adm-grid.png', 'desk-hero.png', 'adm-bk.png'];
  const tiles = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
    const src = pics[(r * 5 + c) % pics.length];
    tiles.push(add(wall, `<div style="position:absolute;left:${c * 500 + (r % 2) * 180}px;top:${r * 420}px;width:460px;height:380px;border-radius:18px;overflow:hidden;opacity:.18"><img src="${SH + src}" style="width:100%;height:100%;object-fit:cover;object-position:top"></div>`));
  }
  const veil = add(root, `<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 48%, ${C.bg}f2 30%, ${C.bg}b0 70%, ${C.bg}80)"></div>`);
  const q = add(root, `<div class="abs" style="left:0;right:0;top:150px;text-align:center;font-size:40px;color:${C.muted};font-weight:500">Как это будет выглядеть у вас?</div>`);
  const h = add(root, `<div class="abs disp" style="left:0;right:0;top:230px;text-align:center;font-size:${Math.round(108 * C.dispScale)}px">${C.cta}</div>`);
  const lg = add(root, `<div class="abs" style="left:0;right:0;top:${N === 'auto' ? 560 : 600}px;display:flex;flex-direction:column;align-items:center;gap:18px">${LOGO(104)}<div style="font-size:38px;color:${C.muted};font-weight:500">Сайт, который записывает клиентов</div></div>`);
  const site = add(root, `<div class="pill" style="left:50%;top:${N === 'auto' ? 800 : 840}px;transform:translateX(-50%);font-size:40px;padding:18px 44px">top-in.ru</div>`);
  return (s) => {
    st(wall, { op: eo(pr(s, 0, 1)), x: -s * 14, y: -s * 6, r: -6, s: 1.05 });
    inn(q, s, 0.1, 0.6, 20);
    inn(h, s, wordAt(sc, 'соберём') - 0.3, 0.8, 40);
    inn(lg, s, sen[2].a - 0.2, 0.8, 40);
    const k = eo(pr(s, sen[2].a + 0.6, sen[2].a + 1.2));
    site.style.opacity = k; site.style.transform = `translate(-50%, ${(1 - k) * 20}px)`;
  };
});

/* ---------- сборка ---------- */
const ROOTS = [], UPD = [];
let glowA, glowB, mark, label, subs, prog;
async function boot() {
  [TL, META] = await Promise.all([fetch(`timeline-${N}.json`).then((r) => r.json()), fetch(`shots/${N}-meta.json`).then((r) => r.json())]);
  glowA = add(stage, `<div class="glow" style="width:900px;height:900px;background:${C.bg2};opacity:.6"></div>`);
  glowB = add(stage, `<div class="glow" style="width:700px;height:700px;background:${C.acc};opacity:.09"></div>`);
  TL.scenes.forEach((sc, i) => {
    const root = add(stage, '<div class="scene"></div>');
    ROOTS.push(root); UPD.push(SCENES[i](root, sc));
  });
  mark = add(stage, `<div class="abs" style="left:56px;top:40px;z-index:90">${LOGO(40)}</div>`);
  label = add(stage, `<div class="abs" style="right:60px;top:48px;z-index:90;font-size:24px;font-weight:600;color:${C.muted};letter-spacing:.04em;text-transform:uppercase">${C.label}</div>`);
  subs = add(stage, '<div class="subs"><span></span></div>');
  prog = add(stage, '<div class="progress"></div>');
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  await new Promise((r) => setTimeout(r, 300));
  window.TOTAL = TL.total;
  seek(0);
  window.ready = true;
}

function seek(t) {
  const S = TL.scenes;
  glowA.style.transform = `translate3d(${1100 + Math.sin(t * 0.13) * 260}px,${-200 + Math.cos(t * 0.11) * 160}px,0)`;
  glowB.style.transform = `translate3d(${-150 + Math.cos(t * 0.09) * 220}px,${620 + Math.sin(t * 0.12) * 140}px,0)`;
  S.forEach((sc, i) => {
    const a = sc.start, b = S[i + 1] ? S[i + 1].start : TL.total + 5;
    const root = ROOTS[i];
    const local = t - a;
    if (t < a - 0.45 || t > b + 0.45) { root.style.display = 'none'; return; }
    root.style.display = '';
    const kin = i === 0 ? 1 : eo(pr(t, a - 0.4, a + 0.25));
    const last = i === S.length - 1;
    const kout = last ? 1 - eio(pr(t, TL.total - 0.9, TL.total - 0.05)) : 1 - eio(pr(t, b - 0.25, b + 0.3));
    root.style.opacity = Math.min(kin, kout);
    root.style.transform = `translate3d(${(1 - kin) * 90 - (1 - kout) * 90}px,0,0)`;
    UPD[i](Math.max(local, -0.4), sc.dur);
  });
  // знак и подпись: не на заставке с логотипом и не на финале
  const s1 = S[1].start;
  const mk = Math.min(eo(pr(t, 0.2, 0.8)), 1 - pr(t, s1 - 0.2, s1 + 0.2) + pr(t, s1 + 3.0, s1 + 3.5), 1 - pr(t, TL.total - 0.9, TL.total - 0.05));
  mark.style.opacity = cl(mk); label.style.opacity = cl(mk);
  // субтитры
  let text = '', op = 0;
  for (const sc of S) {
    for (const p of sentences(sc)) {
      const a = sc.start + p.a, b = sc.start + p.b;
      if (t >= a - 0.1 && t <= b + 0.25) { text = p.text; op = Math.min(pr(t, a - 0.1, a + 0.1), 1 - pr(t, b + 0.05, b + 0.25)); }
    }
  }
  const sp = subs.firstChild;
  if (sp.textContent !== text) sp.textContent = text;
  subs.style.opacity = text ? op : 0;
  prog.style.width = (cl(t / TL.total) * 1920) + 'px';
}
window.seek = seek;
boot();
</script>
